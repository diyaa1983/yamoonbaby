<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>يامون بيبي</title>
    <link rel="icon" type="image/png" href="assets/img/logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(180deg, #f7fbff 0%, #d8efff 100%);
            font-family: Cairo, Tahoma, Arial, sans-serif;
            padding: 20px;
        }
        .box {
            width: min(460px, 92vw);
            background: #fff;
            border-radius: 24px;
            padding: 36px 24px;
            text-align: center;
            box-shadow: 0 18px 40px rgba(11, 79, 134, 0.16);
        }
        img {
            width: 100%;
            border-radius: 14px;
            margin-bottom: 18px;
        }
        h1 {
            margin: 0;
            font-size: 1.7rem;
            color: #0b4f86;
        }
        p {
            margin: 10px 0 0;
            color: #334155;
            font-weight: 700;
            line-height: 1.7;
        }
    </style>
</head>
<body>
    <div class="box">
        <img src="cards/yamoon-ticket.jpg?v=20260916a" alt="بطاقة السحب">
        <h1>التسجيل غير مفعّل حالياً</h1>
        <p>احتفظ بالكوبون. سيتم فتح التسجيل لاحقاً عبر رمز QR قبل موعد السحب.</p>
    </div>
</body>
</html>
